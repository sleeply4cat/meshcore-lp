name: build

# Every push / PR: tests + release build, packages kept as a workflow artifact.
# A pushed tag v* (e.g. v1.17.1-lp2): the same build with that version string, published as a
# GitHub Release with the packages attached.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # only used by the release step on tags

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # release notes need the previous tag

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib make g++
          python3 -m pip install --user --break-system-packages adafruit-nrfutil pyserial || python3 -m pip install --user adafruit-nrfutil pyserial
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: S140 SoftDevice (for repeater-sd.zip only)
        run: |
          mkdir -p third_party/softdevice
          curl -fsSL -o third_party/softdevice/s140_nrf52_6.1.1_softdevice.hex \
            https://raw.githubusercontent.com/adafruit/Adafruit_nRF52_Bootloader/master/lib/softdevice/s140_nrf52_6.1.1/s140_nrf52_6.1.1_softdevice.hex

      - name: Host tests
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log || { echo "::error title=make test::$(tail -30 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; exit 1; }

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="$(sed -n 's/^FW_VERSION *?= *//p' repeater.mk)-$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=version::$v"

      - name: Release build
        run: |
          set -o pipefail
          make release FW_VERSION=${{ steps.ver.outputs.version }} NRFUTIL=$(command -v adafruit-nrfutil) 2>&1 | tee build.log || \
            { echo "::error title=make release::$(grep -vE '^arm-none-eabi-(gcc|g\+\+) ' build.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; exit 1; }

      - name: Packages
        run: |
          v=${{ steps.ver.outputs.version }}
          mkdir -p dist
          cd build/release
          for f in repeater.zip repeater-sd.zip repeater.uf2; do cp "$f" "../../dist/meshcore-lp-repeater-$v${f#repeater}"; done
          cd ../../dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: meshcore-lp-repeater-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          prev=$(git describe --tags --abbrev=0 "$v^" 2>/dev/null || true)
          {
            echo "MeshCore LP repeater firmware \`$v\`."
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`meshcore-lp-repeater-$v.zip\` | serial DFU (\`adafruit-nrfutil dfu serial ... --singlebank\`) |"
            echo "| \`meshcore-lp-repeater-$v.uf2\` | double-tap RESET, copy to the bootloader drive |"
            echo "| \`meshcore-lp-repeater-$v-sd.zip\` | DFU including the S140 SoftDevice (chip with an erased SoftDevice) |"
            echo
            if [ -n "$prev" ]; then echo "Changes since $prev:"; echo; git log --format='- %s' "$prev..$v"; echo; fi
            echo '```'; cat dist/SHA256SUMS; echo '```'
          } > notes.md
          gh release create "$v" dist/* --title "$v" --notes-file notes.md --verify-tag
